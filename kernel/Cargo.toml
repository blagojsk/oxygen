[package]
name = "oxygen-kernel"
description = "The Oxygen microkernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxygen-aarch64 = { path = "../crates/oxygen-aarch64" }
oxygen-audit = { path = "../crates/oxygen-audit" }
oxygen-cap = { path = "../crates/oxygen-cap" }
oxygen-ipc = { path = "../crates/oxygen-ipc" }
oxygen-mem = { path = "../crates/oxygen-mem" }
oxygen-schema = { path = "../crates/oxygen-schema" }

# There is no `test` crate on a freestanding target, so the default test and bench harnesses
# cannot link. Disabling them keeps `--all-targets` usable for lints instead of erroring out;
# host-side unit tests live behind #[cfg(test)] in crates that can run on the host.
[[bin]]
name = "oxygen-kernel"
path = "src/main.rs"
test = false
bench = false

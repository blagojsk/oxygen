# Pinned so every machine and CI run builds the kernel with the same compiler.
# Nightly: freestanding work leans on unstable features, and pinning the channel
# means an upstream nightly change breaks the build on purpose rather than by surprise.
[toolchain]
channel = "nightly"
components = ["rust-src", "llvm-tools-preview", "rustfmt", "clippy"]
targets = ["aarch64-unknown-none-softfloat"]
